location /review-data/auth/v1/ {
    proxy_pass http://127.0.0.1:3810/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
location /review-data/rest/v1/ {
    proxy_pass http://127.0.0.1:3811/;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
location /review-data/storage/v1/ {
    proxy_pass http://127.0.0.1:3812/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Path /review-data/storage/v1;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
}
location /review-data/ { return 404; }

location /review-runtime/api/public/media/sku/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:3008/api/public/media/sku/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
location /review-runtime/ { return 404; }
