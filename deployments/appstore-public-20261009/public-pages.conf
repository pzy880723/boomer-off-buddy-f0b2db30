location = /support {
    limit_except GET { deny all; }
    alias /var/www/boomer-erp-public/appstore-20261009/support.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}

location = /privacy {
    limit_except GET { deny all; }
    alias /var/www/boomer-erp-public/appstore-20261009/privacy.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}
